name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile (esbuild)
        run: npm run compile

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture coupling check
        run: npm run check:coupling

      - name: Unit tests
        run: npm test

      # 打包出的 dist/cli.js 直接喂真实黄金基准，断言 ELF 段级真值
      - name: CLI smoke
        run: |
          node dist/cli.js --version
          node dist/cli.js summary test/fixtures/real/stm32f103-rb-demo-boot.map | node -e "
            let s = '';
            process.stdin.on('data', (d) => (s += d)).on('end', () => {
              const j = JSON.parse(s);
              if (j.tool !== 'mapvisual' || j.totals.flash !== 7648 || j.totals.ram !== 6360) process.exit(1);
              console.log('CLI smoke ok: flash', j.totals.flash, '/ ram', j.totals.ram);
            });"

      # 仅 main 分支推送时打包 vsix 并上传为构建产物（vsce 从 origin 自动识别 GitHub 仓库）
      - name: Package VSIX
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx -y @vscode/vsce package

      - name: Upload VSIX artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mapvisual-vsix
          path: '*.vsix'
          if-no-files-found: error
