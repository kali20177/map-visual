<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MapVisual diff harness</title>
<link rel="stylesheet" href="/media/main.css">
<style>
  :root {
    --vscode-font-family: -apple-system, sans-serif; --vscode-font-size: 13px;
    --vscode-editor-font-family: ui-monospace, Menlo, monospace;
    --vscode-editor-foreground: #cccccc; --vscode-editor-background: #1e1e1e;
    --vscode-sideBar-background: #252526; --vscode-sideBarSectionHeader-foreground: #bbbbbb;
    --vscode-descriptionForeground: #9d9d9d; --vscode-panel-border: rgba(128,128,128,0.25);
    --vscode-input-background: #3c3c3c; --vscode-input-foreground: #cccccc; --vscode-input-border: #3c3c3c;
    --vscode-dropdown-background: #3c3c3c; --vscode-dropdown-foreground: #cccccc; --vscode-dropdown-border: #3c3c3c;
    --vscode-button-background: #0e639c; --vscode-button-foreground: #ffffff;
    --vscode-button-secondaryBackground: #3a3d41; --vscode-button-secondaryForeground: #ffffff;
    --vscode-focusBorder: #007fd4; --vscode-badge-background: #4d4d4d; --vscode-badge-foreground: #ffffff;
    --vscode-list-hoverBackground: #2a2d2e; --vscode-editorWidget-background: #252526;
    --vscode-editorWidget-foreground: #cccccc; --vscode-widget-border: rgba(128,128,128,0.3);
    --vscode-editorWarning-foreground: #cca700;
  }
  html, body { background: #1e1e1e; }
</style>
</head>
<body class="vscode-dark">
<div id="app"></div>
<script>
  window.acquireVsCodeApi = function () {
    return {
      postMessage: function (msg) {
        if (msg.type === 'ready') {
          fetch('/test/mockdiff.json').then(function (r) { return r.json(); }).then(function (diff) {
            setTimeout(function () {
              window.dispatchEvent(new MessageEvent('message', { data: { type: 'diffResult', diff: diff } }));
            }, 120);
          });
        }
      }
    };
  };
</script>
<script src="/dist/diff.js"></script>
</body>
</html>
