<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MapVisual webview harness</title>
<link rel="stylesheet" href="/media/main.css">
<style>
  /* mimic the --vscode-* variables VSCode injects (dark theme values) */
  :root {
    --vscode-font-family: -apple-system, "Segoe UI", sans-serif;
    --vscode-font-size: 13px;
    --vscode-editor-font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    --vscode-editor-foreground: #cccccc;
    --vscode-editor-background: #1e1e1e;
    --vscode-sideBar-background: #252526;
    --vscode-sideBarSectionHeader-foreground: #bbbbbb;
    --vscode-descriptionForeground: #9d9d9d;
    --vscode-panel-border: rgba(128,128,128,0.25);
    --vscode-input-background: #3c3c3c;
    --vscode-input-foreground: #cccccc;
    --vscode-input-border: #3c3c3c;
    --vscode-dropdown-background: #3c3c3c;
    --vscode-dropdown-foreground: #cccccc;
    --vscode-dropdown-border: #3c3c3c;
    --vscode-button-background: #0e639c;
    --vscode-button-foreground: #ffffff;
    --vscode-button-secondaryBackground: #3a3d41;
    --vscode-button-secondaryForeground: #ffffff;
    --vscode-focusBorder: #007fd4;
    --vscode-badge-background: #4d4d4d;
    --vscode-badge-foreground: #ffffff;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-editorWidget-background: #252526;
    --vscode-editorWidget-foreground: #cccccc;
    --vscode-widget-border: rgba(128,128,128,0.3);
    --vscode-editorWarning-foreground: #cca700;
  }
  html, body { background: #1e1e1e; }
</style>
</head>
<body class="vscode-dark">
<div id="app"></div>
<script>
  // Two stores are mocked here, mirroring the extension host:
  //   MV_STATE_KEY — the webview's own setState/getState (same session only);
  //   MV_HOST_KEY  — the host's per-file workspaceState, which replays on every
  //                  start and therefore survives a "restart".
  // Both live in sessionStorage because a page variable dies on reload and the
  // restore paths would never be exercised. Clear MV_STATE_KEY to simulate a
  // fresh VS Code session while keeping the host's copy.
  var MV_STATE_KEY = 'mv.webviewState';
  var MV_HOST_KEY = 'mv.hostViewState';
  var MV_FILE = 'harness:/firmware_sections_gc.map';

  function readJson(key) {
    try {
      return JSON.parse(sessionStorage.getItem(key) || 'null');
    } catch (e) {
      return null;
    }
  }

  function readHost() {
    var host = readJson(MV_HOST_KEY) || {};
    return host[MV_FILE] ? host[MV_FILE].view : null;
  }

  function writeHost(state) {
    var host = readJson(MV_HOST_KEY) || {};
    host[MV_FILE] = { view: state, splitOn: false, ts: Date.now() };
    try {
      sessionStorage.setItem(MV_HOST_KEY, JSON.stringify(host));
    } catch (e) {
      /* ignore */
    }
  }

  window.acquireVsCodeApi = function () {
    return {
      getState: function () {
        return readJson(MV_STATE_KEY);
      },
      setState: function (state) {
        window.__mvState = state;
        try {
          sessionStorage.setItem(MV_STATE_KEY, JSON.stringify(state));
        } catch (e) {
          /* quota / private mode: the in-memory copy is enough for one page life */
        }
      },
      postMessage: function (msg) {
        if (msg.type === 'ready') {
          var restored = readHost();
          // no-store: mockdoc.json is regenerated by hand and http.server sends
          // no cache directives, so a plain fetch can serve a stale document
          fetch('/test/mockdoc.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (doc) {
            setTimeout(function () {
              // the host replays its stored view state before the document
              window.dispatchEvent(new MessageEvent('message', { data: { type: 'viewState', state: restored } }));
              window.dispatchEvent(new MessageEvent('message', { data: { type: 'settings', clickAction: 'locate' } }));
              window.dispatchEvent(new MessageEvent('message', { data: { type: 'parseResult', doc: doc } }));
            }, 120);
          });
        } else {
          if (msg.type === 'persistView') {
            writeHost(msg.state);
          }
          // inspectable from the console *and* from automation (window.__mvMessages)
          (window.__mvMessages = window.__mvMessages || []).push(msg);
          console.log('[mv→host]', JSON.stringify(msg));
        }
      }
    };
  };
</script>
<script src="/dist/webview.js"></script>
</body>
</html>
